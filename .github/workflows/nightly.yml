name: Nightly Sanity Sweep

on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: "Nightly validation"
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clean workspace
        run: |
          set -euo pipefail
          rm -rf zig-out
          mkdir -p .zig-cache .zig-global-cache
          echo "ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-global-cache" >> "$GITHUB_ENV"

      - name: Cache Zig build artifacts
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: zqlite-nightly-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zqlite-nightly-${{ runner.os }}-

      - name: Show Zig version
        run: zig version

      - name: Full test sweep
        run: |
          set -euo pipefail
          ./scripts/test-release.sh

      - name: Memory regression tests
        run: |
          set -euo pipefail
          zig build test-memory-leaks
          zig build test-comprehensive-memory

      - name: Deterministic parser fuzzing
        run: |
          set -euo pipefail
          zig build fuzz-parser --summary all

      - name: File-backed storage sanity
        run: |
          set -euo pipefail
          zig build test-storage

      - name: Valgrind audit
        run: |
          set -euo pipefail
          command -v valgrind
          ZIG=zig ROOT=$PWD ZQLITE_VALGRIND_TESTS="test_security test_upsert test_file_backed test_transaction_atomicity test_index_persistence" docker/scripts/run-valgrind.sh
