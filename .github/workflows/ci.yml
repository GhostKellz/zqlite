name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-release-gate:
    name: Linux release gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-release.sh

  profile-matrix:
    name: Profile ${{ matrix.profile }} / ${{ matrix.optimize }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        profile: [core, advanced, experimental, full]
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
      - run: zig build test -Dprofile=${{ matrix.profile }} -Doptimize=${{ matrix.optimize }} --summary all

  linux-arch-cross-compile:
    name: Linux cross compile ${{ matrix.target }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: zig build -Dtarget=${{ matrix.target }} -Dprofile=advanced

  macos-file-backed:
    name: macOS file-backed smoke
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: zig build test-storage --summary all

  minimum-zig:
    name: Minimum Zig compatibility
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: zig build test --summary all

  stable-core-coverage:
    name: Stable core coverage workload
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p zig-out/coverage
      - run: ./scripts/coverage-report.sh | tee zig-out/coverage/stable-core-coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stable-core-coverage
          path: zig-out/coverage/stable-core-coverage.txt
