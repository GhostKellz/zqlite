services:
  zqlite-test:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: /opt/zig/zig build test --summary all

  zqlite-memory:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: sh -c "/opt/zig/zig build test-memory-leaks && /opt/zig/zig build test-comprehensive-memory"

  zqlite-valgrind:
    image: zqlite-valgrind
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: sh -c "/opt/zig/zig build test-memory-leaks && /opt/zig/zig build test-comprehensive-memory"

  zqlite-full:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: /workspace/zqlite/docker/scripts/full-validation.sh

  zqlite-stress:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: /workspace/zqlite/docker/scripts/stress-test.sh

  zqlite-chaos:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: /workspace/zqlite/docker/scripts/chaos-test.sh 10

  zqlite-perf:
    image: alpine:latest
    network_mode: host
    volumes:
      - ..:/workspace/zqlite
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    working_dir: /workspace/zqlite
    command: /workspace/zqlite/docker/scripts/perf-baseline.sh
