services:
  zqlite-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /opt/zig/zig build test --summary all

  zqlite-memory:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: sh -c "/opt/zig/zig build test-memory-leaks && /opt/zig/zig build test-comprehensive-memory"

  zqlite-valgrind:
    build:
      context: ..
      dockerfile: docker/Dockerfile.valgrind
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: sh /workspace/zqlite/docker/scripts/run-valgrind.sh

  zqlite-audit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.valgrind
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: sh /workspace/zqlite/docker/scripts/run-audit.sh

  zqlite-full:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/full-validation.sh

  zqlite-stress:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/stress-test.sh

  zqlite-chaos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/chaos-test.sh 10

  zqlite-perf:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/perf-baseline.sh

  zqlite-file-storage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/test-file-storage.sh

  zqlite-critical:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    volumes:
      - /opt/zig-0.16.0-dev:/opt/zig:ro
    command: /workspace/zqlite/docker/scripts/test-critical.sh
